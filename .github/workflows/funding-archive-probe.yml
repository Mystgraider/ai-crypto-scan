name: Funding Archive Probe

on:
  pull_request:
    paths:
      - ".github/workflows/funding-archive-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Binance Vision funding archives
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import io
          import os
          import urllib.error
          import urllib.request
          import zipfile
          from datetime import datetime, timezone

          urls = [
              ("daily Sep 10 2026", "https://data.binance.vision/data/futures/um/daily/fundingRate/ETHUSDT/ETHUSDT-fundingRate-2026-09-10.zip"),
              ("monthly Sep 2026", "https://data.binance.vision/data/futures/um/monthly/fundingRate/ETHUSDT/ETHUSDT-fundingRate-2026-09.zip"),
              ("daily Aug 10 2026 control", "https://data.binance.vision/data/futures/um/daily/fundingRate/ETHUSDT/ETHUSDT-fundingRate-2026-08-10.zip"),
              ("monthly Aug 2026 control", "https://data.binance.vision/data/futures/um/monthly/fundingRate/ETHUSDT/ETHUSDT-fundingRate-2026-08.zip"),
          ]
          report = [
              "# Binance Vision funding archive probe",
              "",
              f"Executed UTC: {datetime.now(timezone.utc).isoformat()}",
              "",
              "This is a read-only network diagnostic. No production files or scanner settings are changed.",
              "",
          ]

          for label, url in urls:
              print(f"\n=== {label} ===")
              print(f"REQUEST_URL={url}")
              request = urllib.request.Request(
                  url, headers={"User-Agent": "ai-crypto-scan-funding-probe/1.0"}
              )
              status = "NO_RESPONSE"
              final_url = url
              content_type = "unknown"
              payload = b""
              error = ""
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      status = response.status
                      final_url = response.geturl()
                      content_type = response.headers.get("Content-Type", "unknown")
                      payload = response.read()
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  final_url = exc.geturl()
                  content_type = exc.headers.get("Content-Type", "unknown")
                  try:
                      payload = exc.read()
                  except Exception:
                      payload = b""
                  error = f"HTTPError: {exc}"
              except Exception as exc:
                  error = f"{type(exc).__name__}: {exc}"

              zip_valid = False
              zip_names = []
              csv_headers = []
              csv_rows = 0
              zip_error = ""
              if payload:
                  try:
                      with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                          zip_valid = archive.testzip() is None
                          zip_names = [name for name in archive.namelist() if name.lower().endswith(".csv")]
                          if zip_names:
                              with archive.open(zip_names[0]) as stream:
                                  text_stream = io.TextIOWrapper(stream, encoding="utf-8-sig", newline="")
                                  reader = csv.reader(text_stream)
                                  csv_headers = next(reader, [])
                                  csv_rows = sum(1 for _ in reader)
                  except Exception as exc:
                      zip_error = f"{type(exc).__name__}: {exc}"

              values = {
                  "label": label,
                  "request": url,
                  "status": status,
                  "final_url": final_url,
                  "content_type": content_type,
                  "bytes": len(payload),
                  "zip_valid": zip_valid,
                  "csv_names": zip_names,
                  "csv_headers": csv_headers,
                  "csv_data_rows": csv_rows,
                  "error": error or zip_error or "none",
              }
              for key, value in values.items():
                  print(f"{key.upper()}={value}")
              report.extend([
                  f"## {label}",
                  f"- Requested URL: {url}",
                  f"- HTTP status: {status}",
                  f"- Final URL: {final_url}",
                  f"- Content-Type: {content_type}",
                  f"- Response bytes: {len(payload)}",
                  f"- Valid ZIP: {zip_valid}",
                  f"- CSV files: {zip_names}",
                  f"- First CSV headers: {csv_headers}",
                  f"- CSV data rows: {csv_rows}",
                  f"- Error: {error or zip_error or 'none'}",
                  "",
              ])

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write("\n".join(report) + "\n")
          PY
