name: LONG RRCE Chronological Holdout

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/long-rrce-holdout.yml"
      - "tools/historical_replay.py"
      - "tools/merge_backtest_chunks.py"
      - "engines/long_gate.py"
      - "engines/direction_policy.py"
      - "scanner_v5.py"
      - "config.py"
      - "tests/test_long_gate.py"
      - "tests/test_historical_replay_data_integrity.py"
      - "tests/test_production_risk_contract.py"
      - "engines/**"
      - "indicators/**"

concurrency:
  group: long-rrce-holdout-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  replay:
    name: LONG 10-day chunk (offset ${{ matrix.offset_days }}d)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - {window: 60, offset_days: 60}
          - {window: 60, offset_days: 50}
          - {window: 60, offset_days: 40}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify LONG research branch and files
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "pull_request"
          test "${{ github.event.pull_request.head.ref }}" = "research/long-rrce-reclaim-v2"
          test -f tools/historical_replay.py
          test -f tools/merge_backtest_chunks.py
          test -f engines/long_gate.py
          test -f engines/direction_policy.py
          test -f tests/test_long_gate.py

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LONG contract and replay integrity tests
        run: |
          python -m pytest -q             tests/test_long_gate.py             tests/test_historical_replay_data_integrity.py             tests/test_production_risk_contract.py

      - name: Run fixed 10-day LONG replay chunk
        env:
          BACKTEST_DAYS: "10"
          BACKTEST_OFFSET_DAYS: ${{ matrix.offset_days }}
          BACKTEST_ANCHOR_UTC: ${{ github.event.pull_request.updated_at }}
          BACKTEST_DIRECTION: "LONG"
        run: python tools/historical_replay.py

      - name: Validate LONG chunk contract
        env:
          EXPECTED_OFFSET: ${{ matrix.offset_days }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          data = json.loads(Path("backtest_results.json").read_text(encoding="utf-8"))
          meta = data.get("metadata", {})
          if int(meta.get("days", -1)) != 10:
              raise SystemExit(f"wrong days: {meta.get('days')}")
          if int(meta.get("offset_days", -1)) != int(os.environ["EXPECTED_OFFSET"]):
              raise SystemExit(f"wrong offset: {meta.get('offset_days')}")
          if meta.get("timeline_coverage", {}).get("missing_scans") != 0:
              raise SystemExit(f"missing 5m scans: {meta.get('timeline_coverage')}")
          if meta.get("long_signals_enabled") is not True:
              raise SystemExit("LONG must be enabled")
          if meta.get("short_signals_enabled") is not False:
              raise SystemExit("SHORT must be disabled")
          if meta.get("replay_direction_policy") != ["LONG"]:
              raise SystemExit(f"unexpected direction policy: {meta.get('replay_direction_policy')}")
          rows = data.get("results", [])
          if any(r.get("direction") != "LONG" for r in rows):
              raise SystemExit("non-LONG row found in LONG replay")
          print(json.dumps({
              "start": meta.get("start"),
              "end": meta.get("end"),
              "offset": meta.get("offset_days"),
              "long_signals": len(rows),
              "outcomes": data.get("summary", {}).get("by_rrce_status", {}),
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: long-holdout-window-60-chunk-${{ matrix.offset_days }}
          path: backtest_results.json
          if-no-files-found: error
          retention-days: 21

  analyze:
    name: Merge 30-day LONG window and audit RRCE alignment
    needs: replay
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: long-holdout-window-60-chunk-*
          path: replay-chunks
          merge-multiple: false

      - name: Verify expected chunks and merge
        run: |
          set -euo pipefail
          for offset in 40 50 60; do
            test -f "replay-chunks/long-holdout-window-60-chunk-$offset/backtest_results.json"
          done
          mkdir -p merged
          python tools/merge_backtest_chunks.py             replay-chunks             --expected-offset-days 60             --expected-days 30             --output merged/long_window_60.json

      - name: Audit LONG outcomes, chronology, symbols, grades, and RRCE
        run: |
          python - <<'PY'
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          payload = json.loads(Path("merged/long_window_60.json").read_text(encoding="utf-8"))
          meta = payload["metadata"]
          rows = [r for r in payload["results"] if r.get("direction") == "LONG"]

          if not rows:
              raise SystemExit("LONG replay produced zero signals across the 30-day holdout")

          if any(r.get("direction") != "LONG" for r in payload["results"]):
              raise SystemExit("merged replay contains a non-LONG row")

          outcomes = Counter(r.get("outcome", "UNKNOWN") for r in rows)
          resolved = outcomes["TP1_HIT"] + outcomes["TP2_HIT"] + outcomes["TP3_HIT"] + outcomes["SL_HIT"]
          tp3 = outcomes["TP3_HIT"]
          tp = outcomes["TP1_HIT"] + outcomes["TP2_HIT"] + outcomes["TP3_HIT"]
          tp_rate = round(100 * tp / resolved, 2) if resolved else None

          by_symbol = defaultdict(Counter)
          for r in rows:
              by_symbol[r.get("symbol")][r.get("outcome", "UNKNOWN")] += 1

          chronological = sorted(rows, key=lambda r: r.get("replay_time", ""))
          thirds = {}
          size = max(1, (len(chronological) + 2) // 3)
          for i, label in enumerate(("first", "middle", "last")):
              part = chronological[i * size:(i + 1) * size]
              if part:
                  c = Counter(r.get("outcome", "UNKNOWN") for r in part)
                  rrce = Counter(r.get("rrce_status", "NOT_RUN") for r in part)
                  thirds[label] = {
                      "start": part[0]["replay_time"],
                      "end": part[-1]["replay_time"],
                      "signals": len(part),
                      "tp3": c["TP3_HIT"],
                      "sl": c["SL_HIT"],
                      "expired": c["EXPIRED"],
                      "rrce_status": dict(rrce),
                  }

          rrce = Counter(r.get("rrce_status", "NOT_RUN") for r in rows)
          grades = Counter(r.get("grade", "UNKNOWN") for r in rows)
          print(json.dumps({
              "window": meta,
              "signals": len(rows),
              "outcomes": dict(outcomes),
              "resolved": resolved,
              "tp3": tp3,
              "tp_rate_pct": tp_rate,
              "rrce_status": dict(rrce),
              "grades": dict(grades),
              "by_symbol": {k: dict(v) for k, v in sorted(by_symbol.items())},
              "chronological_thirds": thirds,
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: long-rrce-30d-audit
          path: merged/long_window_60.json
          if-no-files-found: error
          retention-days: 30
