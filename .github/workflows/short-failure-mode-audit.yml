name: SHORT Failure Mode Audit

on:
  push:
    branches:
      - research/short-gate-clean
    paths:
      - "tools/short_failure_mode_audit.py"
      - ".github/workflows/short-failure-mode-audit.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Download latest pooled SHORT audit artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p audit-input
          gh run download 42903218215             --repo "${{ github.repository }}"             --name short-multi-window-audit-result             --dir audit-input
          find audit-input -maxdepth 3 -type f -print
          test -f audit-input/backtest_results.json

      - name: Run failure-mode audit
        run: |
          set -euo pipefail
          cp audit-input/backtest_results.json ./backtest_results.json
          python tools/short_failure_mode_audit.py

      - name: Validate research-only contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open("backtest_results.json"))
          r=p["summary"]["short_failure_mode_audit"]
          assert r["research_only"] is True
          assert r["production_strategy_changed"] is False
          assert r["long_logic_changed"] is False
          assert r["risk_or_sl_tp_geometry_changed"] is False
          print("RESEARCH_ONLY_CONTRACT=PASS")
          print("BASELINE=", r["baseline"])
          print("THIRDS=", r["chronological_thirds"])
          print("SL_QUARTILES=", r["sl_distance_quartiles_pct"])
          print("TIMING=", r["timing"])
          PY

      - name: Upload failure-mode report
        uses: actions/upload-artifact@v4
        with:
          name: short-failure-mode-audit-result
          path: backtest_results.json
          if-no-files-found: error
