name: Historical Backtest

on:
  pull_request:
    paths:
      - "tools/historical_replay.py"
      - "tools/short_candidate_analysis.py"
      - "tests/test_historical_replay_data_integrity.py"
      - "scanner_v5.py"
      - "config.py"
      - "engines/**"
      - "indicators/**"
      - ".github/workflows/historical-backtest.yml"
  workflow_dispatch:
    inputs:
      days:
        description: "Historical replay length in days"
        required: true
        default: "30"
        type: string
      offset_days:
        description: "End date offset from latest fully scoreable data window"
        required: true
        default: "30"
        type: string

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Prevent dispatching the legacy main-branch replay
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${GITHUB_REF_NAME}" != "research/enable-30d-offset60-workflow" ]; then
            echo "::error::Select branch research/enable-30d-offset60-workflow. The main-branch replay does not implement BACKTEST_OFFSET_DAYS or SHORT indicator analysis."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Verify research replay implementation
        if: github.event_name == 'workflow_dispatch'
        run: |
          test -f tools/short_candidate_analysis.py
          grep -q 'OFFSET_DAYS = int(os.getenv("BACKTEST_OFFSET_DAYS"' tools/historical_replay.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run configurable historical replay
        env:
          BACKTEST_DAYS: ${{ inputs.days || '30' }}
          BACKTEST_OFFSET_DAYS: ${{ inputs.offset_days || '30' }}
        run: |
          python tools/historical_replay.py

      - name: Add research-only SHORT RSI/ADX analysis
        if: hashFiles('tools/short_candidate_analysis.py') != ''
        run: |
          python tools/short_candidate_analysis.py

      - name: Upload backtest result
        uses: actions/upload-artifact@v4
        with:
          name: historical-backtest-result
          path: backtest_results.json
          if-no-files-found: error
