name: Historical Backtest

on:
  pull_request:
    paths:
      - "tools/historical_replay.py"
      - "scanner_v5.py"
      - "config.py"
      - "engines/**"
      - "indicators/**"
      - "tests/test_historical_replay_boundary.py"
  workflow_dispatch:
    inputs:
      backtest_days:
        description: "Chronological replay window in days"
        required: false
        default: "7"

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run replay-boundary unit tests
        run: |
          python -m unittest tests/test_historical_replay_boundary.py

      - name: Run historical replay
        env:
          BACKTEST_DAYS: "${{ inputs.backtest_days || '7' }}"
        run: |
          python tools/historical_replay.py

      - name: Upload backtest result
        uses: actions/upload-artifact@v4
        with:
          name: historical-backtest-result
          path: backtest_results.json
          if-no-files-found: error
