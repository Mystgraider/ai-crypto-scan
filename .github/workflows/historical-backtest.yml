name: Historical Backtest

# Research-only validation workflow.
# A push to the research branch runs three contiguous 10-day chunks:
# offsets 90, 80, 70 -> merged into one chronological 30-day / offset-90 artifact.
on:
  push:
    branches:
      - "research/enable-30d-offset60-workflow"
    paths:
      - "tools/historical_replay.py"
      - "tools/short_candidate_analysis.py"
      - "tools/merge_backtest_chunks.py"
      - "tests/test_historical_replay_data_integrity.py"
      - "scanner_v5.py"
      - "config.py"
      - "engines/**"
      - "indicators/**"
      - ".github/workflows/historical-backtest.yml"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RUN to start the fixed 30-day / offset-90 research replay"
        required: true
        default: "RUN"
        type: string

jobs:
  replay:
    name: Replay chunk (end offset ${{ matrix.offset_days }}d)
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirm == 'RUN') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        offset_days: [90, 80, 70]
    timeout-minutes: 360
    steps:
      - name: Require the research branch
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_NAME" != "research/enable-30d-offset60-workflow" ]; then
            echo "::error::This research replay must run from research/enable-30d-offset60-workflow, not $REF_NAME."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Verify research replay implementation
        run: |
          set -euo pipefail
          test -f tools/historical_replay.py
          test -f tools/short_candidate_analysis.py
          test -f tools/merge_backtest_chunks.py
          grep -q 'OFFSET_DAYS = int(os.getenv("BACKTEST_OFFSET_DAYS"' tools/historical_replay.py
          grep -q 'BACKTEST_DAYS' tools/historical_replay.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run historical replay data-integrity tests
        run: |
          python -m pytest -q tests/test_historical_replay_data_integrity.py

      - name: Run 10-day historical replay chunk
        env:
          BACKTEST_DAYS: "10"
          BACKTEST_OFFSET_DAYS: ${{ matrix.offset_days }}
        run: |
          set -euo pipefail
          python tools/historical_replay.py

      - name: Validate chunk artifact
        env:
          EXPECTED_OFFSET: ${{ matrix.offset_days }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("backtest_results.json")
          if not path.is_file():
              raise SystemExit("missing backtest_results.json")

          payload = json.loads(path.read_text(encoding="utf-8"))
          metadata = payload.get("metadata", {})

          if int(metadata.get("days", -1)) != 10:
              raise SystemExit(f"unexpected chunk days: {metadata.get('days')}")

          expected = int(os.environ["EXPECTED_OFFSET"])
          actual = int(metadata.get("offset_days", -1))
          if actual != expected:
              raise SystemExit(f"unexpected chunk offset: {actual}; expected {expected}")

          if not isinstance(payload.get("results"), list):
              raise SystemExit("results is not a list")

          if not metadata.get("start") or not metadata.get("end"):
              raise SystemExit("chunk is missing start/end metadata")

          print(
              "validated chunk:",
              metadata["start"],
              "->",
              metadata["end"],
              "signals=",
              len(payload["results"]),
          )
          PY

      - name: Upload replay chunk
        uses: actions/upload-artifact@v4
        with:
          name: historical-backtest-chunk-${{ matrix.offset_days }}
          path: backtest_results.json
          if-no-files-found: error
          retention-days: 14

  analyze:
    name: Merge 30-day replay and run SHORT analysis
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirm == 'RUN') }}
    needs: replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download replay chunks
        uses: actions/download-artifact@v5
        with:
          pattern: historical-backtest-chunk-*
          path: replay-chunks
          merge-multiple: false

      - name: Verify all three chunks exist
        run: |
          set -euo pipefail
          for offset in 70 80 90; do
            test -f "replay-chunks/historical-backtest-chunk-$offset/backtest_results.json"
          done
          find replay-chunks -maxdepth 2 -type f -print

      - name: Merge chunks into one 30-day offset-90 artifact
        run: |
          set -euo pipefail
          python tools/merge_backtest_chunks.py             replay-chunks             --expected-offset-days 90             --expected-days 30             --output backtest_results.json

      - name: Run full SHORT candidate analysis on merged result
        run: |
          set -euo pipefail
          python tools/short_candidate_analysis.py

      - name: Upload merged 30-day result
        uses: actions/upload-artifact@v4
        with:
          name: historical-backtest-result
          path: backtest_results.json
          if-no-files-found: error
          retention-days: 30
