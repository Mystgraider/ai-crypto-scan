name: Historical Backtest

on:
  push:
    branches:
      - research/enable-30d-offset60-workflow
    paths:
      - "tools/historical_replay.py"
      - "tools/short_candidate_analysis.py"
      - "tests/test_historical_replay_data_integrity.py"
      - "scanner_v5.py"
      - "config.py"
      - "engines/**"
      - "indicators/**"
      - ".github/workflows/historical-backtest.yml"
  pull_request:
    paths:
      - "tools/historical_replay.py"
      - "tools/short_candidate_analysis.py"
      - "tests/test_historical_replay_data_integrity.py"
      - "scanner_v5.py"
      - "config.py"
      - "engines/**"
      - "indicators/**"
      - ".github/workflows/historical-backtest.yml"
  workflow_dispatch:
    inputs:
      days:
        description: "Historical replay length in days"
        required: true
        default: "30"
        type: string
      offset_days:
        description: "End date offset from latest fully scoreable data window"
        required: true
        default: "60"
        type: string

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Require the research branch for manual runs
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${GITHUB_REF_NAME}" != "research/enable-30d-offset60-workflow" ]; then
            echo "::error::This research replay must run from research/enable-30d-offset60-workflow, not ${GITHUB_REF_NAME}."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Verify offset and candidate-analysis code are present
        if: github.event_name == 'workflow_dispatch'
        run: |
          test -f tools/short_candidate_analysis.py
          grep -q 'OFFSET_DAYS = int(os.getenv("BACKTEST_OFFSET_DAYS"' tools/historical_replay.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run historical replay data-integrity tests
        run: |
          python -m pytest -q tests/test_historical_replay_data_integrity.py

      - name: Run configurable historical replay
        env:
          BACKTEST_DAYS: ${{ inputs.days || '30' }}
          BACKTEST_OFFSET_DAYS: ${{ inputs.offset_days || '60' }}
        run: |
          python tools/historical_replay.py

      - name: Add full multi-timeframe SHORT indicator analysis
        run: |
          python tools/short_candidate_analysis.py

      - name: Upload backtest result
        uses: actions/upload-artifact@v4
        with:
          name: historical-backtest-result
          path: backtest_results.json
          if-no-files-found: error
