name: Historical Backtest

# Research-only trigger: a branch push runs the fixed 30-day, offset-90 chunked replay.
on:
  pull_request:
    paths:
      - "tools/historical_replay.py"
      - "tools/short_candidate_analysis.py"
      - "tools/merge_backtest_chunks.py"
      - "tests/test_historical_replay_data_integrity.py"
      - "scanner_v5.py"
      - "config.py"
      - "engines/**"
      - "indicators/**"
      - ".github/workflows/historical-backtest.yml"
  workflow_dispatch:
    inputs:
      days:
        description: "Historical replay length in days; this research workflow is fixed at 30 days"
        required: true
        default: "30"
        type: string
      offset_days:
        description: "End-date offset from the latest fully scoreable data window"
        required: true
        default: "90"
        type: string

jobs:
  replay:
    name: Replay chunk (end offset ${{ matrix.offset_days }}d)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        offset_days: [90, 80, 70]
    timeout-minutes: 360
    steps:
      - name: Require the research branch for manual runs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_DAYS: ${{ inputs.days }}
          INPUT_OFFSET: ${{ inputs.offset_days }}
        run: |
          set -euo pipefail
          if [ "$REF_NAME" != "research/enable-30d-offset60-workflow" ]; then
            echo "::error::This research replay must run from research/enable-30d-offset60-workflow, not $REF_NAME."
            exit 1
          fi
          if [ "$INPUT_DAYS" != "30" ]; then
            echo "::error::This workflow is intentionally fixed at 30 days; received days=$INPUT_DAYS."
            exit 1
          fi
          case "$INPUT_OFFSET" in
            70|80|90) ;;
            *)
              echo "::error::offset_days must be 70, 80, or 90 for this fixed 30-day chunked validation."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Verify research replay files
        run: |
          set -euo pipefail
          test -f tools/historical_replay.py
          test -f tools/short_candidate_analysis.py
          test -f tools/merge_backtest_chunks.py
          grep -q 'OFFSET_DAYS = int(os.getenv("BACKTEST_OFFSET_DAYS"' tools/historical_replay.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run historical replay data-integrity tests
        run: |
          python -m pytest -q tests/test_historical_replay_data_integrity.py

      - name: Run 10-day historical replay chunk
        env:
          BACKTEST_DAYS: "10"
          BACKTEST_OFFSET_DAYS: ${{ matrix.offset_days }}
        run: |
          python tools/historical_replay.py

      - name: Validate chunk artifact
        env:
          EXPECTED_OFFSET: ${{ matrix.offset_days }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("backtest_results.json")
          if not path.is_file():
              raise SystemExit("missing backtest_results.json")

          payload = json.loads(path.read_text(encoding="utf-8"))
          metadata = payload.get("metadata", {})
          if int(metadata.get("days", -1)) != 10:
              raise SystemExit(f"unexpected chunk days: {metadata.get('days')}")
          if int(metadata.get("offset_days", -1)) != int(os.environ["EXPECTED_OFFSET"]):
              raise SystemExit(
                  f"unexpected chunk offset: {metadata.get('offset_days')} "
                  f"expected {os.environ['EXPECTED_OFFSET']}"
              )
          if not isinstance(payload.get("results"), list):
              raise SystemExit("results is not a list")
          print(
              "validated chunk:",
              metadata.get("start"),
              "->",
              metadata.get("end"),
              "signals=",
              len(payload["results"]),
          )
          PY

      - name: Upload replay chunk
        uses: actions/upload-artifact@v4
        with:
          name: historical-backtest-chunk-${{ matrix.offset_days }}
          path: backtest_results.json
          if-no-files-found: error
          retention-days: 14

  analyze:
    name: Merge 30-day replay and run SHORT analysis
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    needs: replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download replay chunks
        uses: actions/download-artifact@v5
        with:
          pattern: historical-backtest-chunk-*
          path: replay-chunks
          merge-multiple: false

      - name: Verify all three chunks exist
        run: |
          set -euo pipefail
          for offset in 70 80 90; do
            test -f "replay-chunks/historical-backtest-chunk-$offset/backtest_results.json"
          done
          find replay-chunks -maxdepth 2 -type f -print

      - name: Merge chunks into one 30-day artifact
        run: |
          python tools/merge_backtest_chunks.py replay-chunks --expected-offset-days 90 --expected-days 30 --output backtest_results.json

      - name: Run full SHORT candidate analysis on the merged 30-day result
        run: |
          python tools/short_candidate_analysis.py

      - name: Upload merged 30-day result
        uses: actions/upload-artifact@v4
        with:
          name: historical-backtest-result
          path: backtest_results.json
          if-no-files-found: error
          retention-days: 30
