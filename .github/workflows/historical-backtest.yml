name: Historical Backtest

on:
  pull_request:
    paths:
      - "tools/historical_replay.py"
      - "tools/candidate_c5_analysis.py"
      - "tools/short_candidate_analysis.py"
      - "scanner_v5.py"
      - "config.py"
      - "engines/**"
      - "indicators/**"
      - ".github/workflows/historical-backtest.yml"
  workflow_dispatch:
    inputs:
      days:
        description: "Historical replay length in days"
        required: true
        default: "30"
        type: string
      offset_days:
        description: "End date offset from run date in days"
        required: true
        default: "3"
        type: string

jobs:
  replay:
    runs-on: ubuntu-latest
    # Research-only replay; offset leaves recent candles time to finalize.
    # Production scanner and strategy are not modified by this workflow.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run configurable historical replay
        env:
          BACKTEST_DAYS: ${{ inputs.days || '30' }}
          BACKTEST_OFFSET_DAYS: ${{ inputs.offset_days || '3' }}
        run: |
          python tools/historical_replay.py

      - name: Add research-only Candidate C5 comparison
        run: |
          python tools/candidate_c5_analysis.py

      - name: Add research-only SHORT RSI/ADX comparison
        run: |
          python tools/short_candidate_analysis.py

      - name: Upload backtest result
        uses: actions/upload-artifact@v4
        with:
          name: historical-backtest-result
          path: backtest_results.json
          if-no-files-found: error
