name: Historical Backtest

on:
  pull_request:
    paths:
      - "tools/historical_replay.py"
      - "scanner_v5.py"
      - "config.py"
      - "engines/**"
      - "indicators/**"
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 30-day chronological historical replay
        env:
          BACKTEST_DAYS: "30"
        run: |
          python tools/historical_replay.py

      - name: Upload backtest result
        uses: actions/upload-artifact@v4
        with:
          name: historical-backtest-result
          path: backtest_results.json
          if-no-files-found: error
