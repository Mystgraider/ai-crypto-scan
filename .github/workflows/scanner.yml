name: Elite Futures Scanner V6

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      scan_ref:
        description: "Branch or tag to scan (default: main)"
        required: false
        default: "main"
        type: string

jobs:
  scan:
    if: github.event_name != 'schedule' || github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    concurrency:
      group: elite-scanner
      cancel-in-progress: false

    permissions:
      contents: write

    env:
      PYTHONUNBUFFERED: "1"
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.scan_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show scan ref
        run: |
          echo "Workflow ref: $GITHUB_REF"
          echo "Workflow SHA: $GITHUB_SHA"
          echo "Requested scan ref: ${{ inputs.scan_ref || github.ref }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify scanner integrity
        run: python -m py_compile scanner_v5.py

      - name: Run Scanner V6
        run: python scanner_v5.py

      - name: Save generated scanner state
        if: always()
        run: |
          git config user.name "Elite Scanner Bot"
          git config user.email "bot@elitescanner.dev"

          # The scanner may run from a checkout that became stale while
          # another workflow/manual merge updated main. Re-anchor the local
          # branch to the current remote main while preserving generated
          # state in the working tree, then commit only the state files.
          git fetch origin main
          git reset --mixed origin/main

          git add storage/signals.csv storage/cooldown.json storage/circuit_breaker.json storage/rrce_watchlist.json storage/scan_debug_log.jsonl storage/symbol_trace_log.jsonl || true

          if git diff --staged --quiet; then
            echo "No generated scanner state changes to commit."
            exit 0
          fi

          git commit -m "chore: update scanner state"
          git push origin HEAD:main

  daily_report:
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    env:
      PYTHONUNBUFFERED: "1"
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send Daily Report
        run: python daily_report_runner.py

      - name: Save updated statuses
        if: always()
        run: |
          git config user.name "Elite Scanner Bot"
          git config user.email "bot@elitescanner.dev"

          # Re-anchor before pushing so manual merges or other state commits
          # cannot cause a non-fast-forward failure.
          git fetch origin main
          git reset --mixed origin/main

          git add storage/signals.csv || true

          if git diff --staged --quiet; then
            echo "No updated signal statuses to commit."
            exit 0
          fi

          git commit -m "chore: update signal statuses [skip ci]"
          git push origin HEAD:main
