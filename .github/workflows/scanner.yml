name: Elite Futures Scanner V6

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scan:
    if: github.event_name != 'schedule' || github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    concurrency:
      group: elite-scanner
      cancel-in-progress: false

    permissions:
      contents: write

    env:
      PYTHONUNBUFFERED: "1"
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify scanner integrity
        run: python -m py_compile scanner_v5.py

      - name: Run Scanner V6
        run: python scanner_v5.py

      - name: Save generated scanner state
        if: always()
        run: |
          git config user.name "Elite Scanner Bot"
          git config user.email "bot@elitescanner.dev"
          git add storage/signals.csv storage/cooldown.json storage/circuit_breaker.json storage/rrce_watchlist.json storage/scan_debug_log.jsonl storage/experiment_4h_log.jsonl storage/symbol_trace_log.jsonl || true
          git diff --staged --quiet || git commit -m "chore: update scanner state"
          git push

  daily_report:
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    env:
      PYTHONUNBUFFERED: "1"
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send Daily Report
        run: python daily_report_runner.py

      - name: Save updated statuses
        if: always()
        run: |
          git config user.name "Elite Scanner Bot"
          git config user.email "bot@elitescanner.dev"
          git add storage/signals.csv || true
          git diff --staged --quiet || git commit -m "chore: update signal statuses [skip ci]"
          git push
