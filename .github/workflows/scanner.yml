name: Elite Futures Scanner V5

on:
  schedule:
    # Every 5 minutes — main scan
    - cron: '*/5 * * * *'
    # Daily report at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scan:
    if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    concurrency:
      group: elite-scanner
      cancel-in-progress: false

    env:
      PYTHONUNBUFFERED: "1"
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID:   ${{ secrets.CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scanner V5
        run: python scanner_v5.py

  daily_report:
    if: github.event.schedule == '0 0 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      PYTHONUNBUFFERED: "1"
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID:   ${{ secrets.CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send Daily Report
        run: python daily_report_runner.py
