name: SHORT Independent Holdout 60

on:
  push:
    branches:
      - research/enable-30d-offset60-workflow
      - research/short-gate-clean
    paths:
      - ".github/workflows/short-holdout-120.yml"
      - "tools/historical_replay.py"
      - "tools/short_candidate_analysis.py"
      - "tools/short_setup_alignment.py"
      - "tools/rrce_aligned_short_analysis.py"
      - "tests/test_rrce_aligned_short_analysis.py"
      - "tools/merge_backtest_chunks.py"
      - "tests/test_historical_replay_data_integrity.py"
      - "tests/test_production_risk_contract.py"
      - "scanner_v5.py"
      - "config.py"
      - "engines/**"
      - "indicators/**"
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: short-holdout-60-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  replay:
    name: Independent 10-day chunk (offset ${{ matrix.offset_days }}d)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        offset_days: [60, 50, 40]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify research branch and required files
        run: |
          set -euo pipefail
          RESEARCH_REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          case "${RESEARCH_REF}" in
            research/enable-30d-offset60-workflow|research/short-gate-clean) ;;
            *) echo "::error::Unexpected research branch: ${GITHUB_REF_NAME}"; exit 1 ;;
          esac
          test -f tools/historical_replay.py
          test -f tools/short_candidate_analysis.py
          test -f tools/short_setup_alignment.py
          test -f tools/rrce_aligned_short_analysis.py
          test -f tools/merge_backtest_chunks.py
          test -f tests/test_historical_replay_data_integrity.py

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run replay integrity and SHORT production contract tests
        run: |
          python -m pytest -q             tests/test_historical_replay_data_integrity.py             tests/test_production_risk_contract.py             tests/test_rrce_aligned_short_analysis.py

      - name: Run fixed 10-day replay chunk
        env:
          BACKTEST_DAYS: "10"
          BACKTEST_OFFSET_DAYS: ${{ matrix.offset_days }}
          BACKTEST_ANCHOR_UTC: ${{ github.run_started_at }}
        run: python tools/historical_replay.py

      - name: Validate chunk metadata, coverage, and SHORT contract
        env:
          EXPECTED_OFFSET: ${{ matrix.offset_days }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("backtest_results.json")
          if not p.is_file():
              raise SystemExit("missing backtest_results.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          meta = data.get("metadata", {})
          if int(meta.get("days", -1)) != 10:
              raise SystemExit(f"wrong days: {meta.get('days')}")
          if int(meta.get("offset_days", -1)) != int(os.environ["EXPECTED_OFFSET"]):
              raise SystemExit(f"wrong offset: {meta.get('offset_days')}")
          if meta.get("timeline_coverage", {}).get("missing_scans") != 0:
              raise SystemExit(f"missing 5m scans: {meta.get('timeline_coverage')}")
          if meta.get("long_signals_enabled") is not False:
              raise SystemExit("LONG must remain disabled")
          if meta.get("replay_direction_policy") != ["SHORT"]:
              raise SystemExit(f"unexpected direction policy: {meta.get('replay_direction_policy')}")
          shorts=[r for r in data["results"] if r.get("direction")=="SHORT"]
          if not shorts:
              raise SystemExit("zero SHORT signals")
          missing=[r for r in shorts if any(r.get(k) is None for k in ("rsi_15m","adx_15m","ema20_15m","ema50_15m")) or r.get("mtf_15m") not in {"BULLISH","BEARISH","NEUTRAL"}]
          invalid=[r for r in shorts if not (50<=float(r.get("rsi",-1))<=70) or float(r.get("adx",999))>=20 or r.get("mtf_15m") in {"BEARISH","UNKNOWN"} or float(r.get("atr_pct",999))>=.8 or not (0<=float(r.get("price_to_ema20_pct",-999))<=1)]
          if missing: raise SystemExit(f"incomplete 15m context: {len(missing)}/{len(shorts)}")
          if invalid: raise SystemExit(f"SHORT gate contract violated: {len(invalid)} rows")
          print(json.dumps({"start":meta.get("start"),"end":meta.get("end"),"offset":meta.get("offset_days"),"short_signals":len(shorts),"missing_15m":len(missing),"invalid_gate":len(invalid)},indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: short-holdout-60-chunk-${{ matrix.offset_days }}
          path: backtest_results.json
          if-no-files-found: error
          retention-days: 21

  analyze:
    name: Merge independent 30-day offset-60 window and align SHORT
    needs: replay
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: short-holdout-60-chunk-*
          path: replay-chunks
          merge-multiple: false

      - name: Verify expected chunks and merge
        run: |
          set -euo pipefail
          for offset in 40 50 60; do
            test -f "replay-chunks/short-holdout-60-chunk-$offset/backtest_results.json"
          done
          python tools/merge_backtest_chunks.py replay-chunks --expected-offset-days 60 --expected-days 30 --output backtest_results.json

      - name: Run baseline SHORT analysis
        run: python tools/short_candidate_analysis.py

      - name: Run RRCE-aligned SHORT analysis
        run: python tools/rrce_aligned_short_analysis.py

      - name: Run fixed setup-alignment audit
        run: python tools/short_setup_alignment.py

      - uses: actions/upload-artifact@v4
        with:
          name: short-independent-holdout-60-result
          path: backtest_results.json
          if-no-files-found: error
          retention-days: 30
