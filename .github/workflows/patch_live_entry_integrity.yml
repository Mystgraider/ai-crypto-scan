name: Patch Live Entry Integrity

on:
  push:
    paths:
      - '.github/workflows/patch_live_entry_integrity.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply surgical scanner patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scanner_v5.py')
          text = path.read_text()

          old_import = 'from engines.position_sizer      import PositionSizer\n'
          new_import = old_import + 'from engines.live_entry_integrity import revalidate as revalidate_live_entry\n'
          assert old_import in text, 'position_sizer import anchor not found'
          assert 'from engines.live_entry_integrity import revalidate as revalidate_live_entry' not in text
          text = text.replace(old_import, new_import, 1)

          old_initial = '''                rrce_risk = rrce_engine.live_entry_levels(
                    direction=direction,
                    live_price=price,
                    stage4=rrce_result["stage4"],
                    max_deviation_pct=CONFIG["rrce_entry_max_deviation_pct"],
                    min_rr=CONFIG["min_rr"],
                )
'''
          new_initial = '''                rrce_risk = active_rrce_engine.live_entry_levels(
                    direction=direction,
                    live_price=price,
                    stage4=rrce_result["stage4"],
                    max_deviation_pct=CONFIG["rrce_entry_max_deviation_pct"],
                    min_rr=CONFIG["min_rr"],
                )
'''
          assert text.count(old_initial) == 1, 'initial RRCE live-entry block not found exactly once'
          text = text.replace(old_initial, new_initial, 1)

          old_candidate = '''                    "rr":              risk["rr"],
                    "entry":           risk["entry"],
                    "sl":              risk["sl"],
                    "tp1":             risk["tp1"],
                    "tp2":             risk["tp2"],
                    "tp3":             risk["tp3"],
                    "rsi":             round(rsi, 2),
'''
          new_candidate = '''                    "rr":              risk["rr"],
                    "entry":           risk["entry"],
                    "sl":              risk["sl"],
                    "tp1":             risk["tp1"],
                    "tp2":             risk["tp2"],
                    "tp3":             risk["tp3"],
                    "_rrce_stage4":   rrce_result["stage4"],
                    "_rrce_engine_mode": "range" if is_range_regime else "default",
                    "rsi":             round(rsi, 2),
'''
          assert text.count(old_candidate) == 1, 'candidate risk field anchor not found exactly once'
          text = text.replace(old_candidate, new_candidate, 1)

          old_alert = '''        try:
            fresh_price = float(exchange.fetch_ticker(sig["symbol"])["last"])
            drift_pct = abs(fresh_price - sig["entry"]) / sig["entry"] * 100
            max_drift = CONFIG.get("max_entry_drift_pct", 0.6)
            if drift_pct > max_drift:
                print(f"  ⏭️  {sig['symbol']} {sig['direction']} skipped — "
                      f"price drifted {drift_pct:.2f}% since detection "
                      f"(entry {sig['entry']} → now {fresh_price})")
                continue
            sig["entry"] = fresh_price
        except Exception as e:
            print(f"  ⚠️  {sig['symbol']} staleness check failed ({e}) — sending with original entry")
'''
          new_alert = '''        try:
            fresh_price = float(exchange.fetch_ticker(sig["symbol"])["last"])
            drift_pct = abs(fresh_price - sig["entry"]) / sig["entry"] * 100
            max_drift = CONFIG.get("max_entry_drift_pct", 0.6)
            if drift_pct > max_drift:
                print(f"  ⏭️  {sig['symbol']} {sig['direction']} skipped — "
                      f"price drifted {drift_pct:.2f}% since detection "
                      f"(entry {sig['entry']} → now {fresh_price})")
                continue

            live_rrce_engine = (
                range_rrce_engine
                if sig.get("_rrce_engine_mode") == "range"
                else rrce_engine
            )
            live_risk = revalidate_live_entry(
                rrce_engine=live_rrce_engine,
                direction=sig["direction"],
                live_price=fresh_price,
                stage4=sig.get("_rrce_stage4"),
                max_deviation_pct=max_drift,
                min_rr=CONFIG["min_rr"],
            )
            if not live_risk.get("valid"):
                print(f"  ⏭️  {sig['symbol']} {sig['direction']} skipped — "
                      f"live RRCE revalidation failed: {live_risk.get('reason', 'unknown')}")
                continue

            # Replace the complete executable risk set before sizing, Telegram,
            # or persistence uses the signal.
            sig["entry"] = live_risk["entry"]
            sig["sl"] = live_risk["sl"]
            sig["tp1"] = live_risk["tp1"]
            sig["tp2"] = live_risk["tp2"]
            sig["tp3"] = live_risk["tp3"]
            sig["rr"] = live_risk["rr"]
        except Exception as e:
            print(f"  ⚠️  {sig['symbol']} live entry validation failed ({e}) — skipping signal")
            continue
'''
          assert text.count(old_alert) == 1, 'alert live-price block not found exactly once'
          text = text.replace(old_alert, new_alert, 1)

          old_before_save = '''        save_signal(
            symbol=sig["symbol"],'''
          new_before_save = '''        sig.pop("_rrce_stage4", None)
        sig.pop("_rrce_engine_mode", None)

        save_signal(
            symbol=sig["symbol"],'''
          assert text.count(old_before_save) == 1, 'save_signal anchor not found exactly once'
          text = text.replace(old_before_save, new_before_save, 1)

          path.write_text(text)
          print('Surgical live-entry integrity patch applied.')
          PY

      - name: Verify syntax and focused tests
        run: |
          python -m py_compile scanner_v5.py engines/live_entry_integrity.py tests/test_live_entry_integrity.py
          python -m pytest -q tests/test_live_entry_integrity.py

      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/patch_live_entry_integrity.yml
          git config user.name "Elite Scanner Bot"
          git config user.email "bot@elitescanner.dev"
          git add scanner_v5.py .github/workflows/patch_live_entry_integrity.yml
          git commit -m "fix: revalidate live RRCE entry levels before alert"
          git push
