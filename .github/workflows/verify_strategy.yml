name: Verify Strategy Integrity

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'engines/**'
      - 'ai/**'
      - 'indicators/**'
      - 'loaders/**'
      - 'storage/**'
      - 'tracker/**'
      - 'reports/**'
      - 'alerts/**'
      - 'scanner_v5.py'
      - 'config.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/verify_strategy.yml'
      - '.github/workflows/scanner.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile production code
        run: |
          python -m compileall -q ai engines indicators loaders reports storage tracker alerts scanner_v5.py config.py

      - name: Compile tests
        run: |
          python -m compileall -q tests

      - name: Run full test suite
        run: |
          python -m pytest -q