name: Verify Strategy Integrity

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'ai/attribution_analytics.py'
      - 'ai/data_sufficiency.py'
      - 'tests/test_phase2d_d3b_attribution_analytics.py'
      - '.github/workflows/verify_strategy.yml'
      - 'engines/beta_filter.py'
      - 'engines/funding_engine.py'
      - 'engines/oi_engine.py'
      - 'engines/rrce_engine.py'
      - 'engines/live_entry_integrity.py'
      - 'engines/validator.py'
      - 'scanner_v5.py'
      - 'storage/signal_logger.py'
      - 'ai/signal_ranker.py'
      - 'ai/attribution.py'
      - 'ai/confidence_engine.py'
      - 'reports/calibration_engine.py'
      - 'reports/calibration_report.py'
      - 'reports/tuning_advisor.py'
      - 'tests/test_phase2b_engines.py'
      - 'tests/test_phase2c_decision_pipeline.py'
      - 'tests/test_phase2d_ai_integrity.py'
      - 'tests/test_phase2d_d1_attribution.py'
      - 'tests/test_phase2d_d2_logging_attribution.py'
      - 'tests/test_phase2d_d2_scanner_wiring.py'
      - 'tests/test_phase2d_d3a_data_sufficiency.py'
      - 'tests/test_phase2d_b0_logging.py'
      - 'tests/test_phase2d_b1_calibration.py'
      - 'tests/test_phase2d_b2_reporting.py'
      - 'tests/test_phase2d_c_tuning_advisor.py'
      - 'tests/test_rrce_strategy_integrity.py'
      - 'tests/test_live_entry_integrity.py'
      - 'requirements.txt'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify strategy integrity and Phase 2D-D3B
        run: |
          python -m py_compile ai/attribution_analytics.py ai/data_sufficiency.py tests/test_phase2d_d3b_attribution_analytics.py
          python -m pytest -q tests/test_phase2d_d3b_attribution_analytics.py
