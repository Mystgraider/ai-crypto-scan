name: Apply Phase 2C Decision Pipeline Fix

on:
  push:
    branches: [main]

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, '[phase2c]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply surgical Phase 2C patch
        run: |
          python - <<'PY'
          from pathlib import Path

          scanner = Path('scanner_v5.py')
          text = scanner.read_text()

          replacements = [
              (
                  '''                if not CONFIG.get("require_trend_gate", True) and trend["direction"] == "NONE":\n                    effective_trend_score = CONFIG["min_score"]\n                else:\n                    effective_trend_score = trend_score\n''',
                  '''                # Do not manufacture a passing score when the legacy trend gate is disabled.\n                effective_trend_score = trend_score\n''',
                  'scanner trend score'
              ),
              (
                  '''                effective_quality_score = quality_score\n                if not CONFIG.get("require_quality_engine", True) and quality_score < CONFIG["min_score"]:\n                    effective_quality_score = CONFIG["min_score"]\n\n''',
                  '''                # Keep the observed quality score even when the legacy quality gate is disabled.\n                effective_quality_score = quality_score\n\n''',
                  'scanner quality score'
              ),
              (
                  '''                oi_result = {"oi_signal": "NEUTRAL", "score_adj": 0, "oi_change_pct": 0}\n                if CONFIG["oi_enabled"]:\n                    try:\n                        oi_data = oi_engine.fetch_oi(exchange, symbol)\n                        if oi_data["available"]:\n                            price_chg = float(df_1h["close"].pct_change().iloc[-1] * 100)\n                            oi_result = oi_engine.analyze(\n                                current_oi=oi_data["current_oi"],\n                                previous_oi=oi_data["previous_oi"],\n                                price_change=price_chg,\n                                direction=direction,\n                            )\n                    except Exception:\n                        pass\n''',
                  '''                oi_result = {"oi_signal": "NEUTRAL", "score_adj": 0, "oi_change_pct": 0}\n                if CONFIG["oi_enabled"]:\n                    try:\n                        oi_data = oi_engine.fetch_oi(exchange, symbol)\n                        if not oi_data.get("available"):\n                            skip["oi_unavailable"] = skip.get("oi_unavailable", 0) + 1\n                            _trace(symbol, "oi_unavailable", direction=direction,\n                                   reason=oi_data.get("reason", "unknown"))\n                            continue\n\n                        price_chg = float(df_1h["close"].pct_change().iloc[-1] * 100)\n                        oi_result = oi_engine.analyze(\n                            current_oi=oi_data["current_oi"],\n                            previous_oi=oi_data["previous_oi"],\n                            price_change=price_chg,\n                            direction=direction,\n                        )\n                    except Exception as _oi_error:\n                        skip["oi_unavailable"] = skip.get("oi_unavailable", 0) + 1\n                        _trace(symbol, "oi_unavailable", direction=direction,\n                               reason=type(_oi_error).__name__)\n                        continue\n''',
                  'scanner OI availability'
              ),
              (
                  '''                max_deviation_pct=max_drift,\n                min_rr=CONFIG["min_rr"],\n''',
                  '''                max_deviation_pct=CONFIG["rrce_entry_max_deviation_pct"],\n                min_rr=CONFIG["min_rr"],\n''',
                  'scanner live RRCE tolerance'
              ),
              (
                  '''            f"🤖 Confidence: <b>{confidence}%</b>\\n\\n"\n            f"{sizer.format_recommendation(sizing)}"\n''',
                  '''            f"🤖 Confidence: <b>{confidence}%</b> | "\n            f"AI Rank: <b>{sig.get('ai_composite', sig['composite'])}</b>\\n\\n"\n            f"{sizer.format_recommendation(sizing)}"\n''',
                  'scanner AI rank display'
              ),
          ]

          for old, new, label in replacements:
              if old not in text:
                  raise SystemExit(f'{label}: exact source block not found')
              text = text.replace(old, new, 1)
          scanner.write_text(text)

          validator = Path('engines/validator.py')
          text = validator.read_text()
          old = '''        min_score = CONFIG["min_score"]\n\n        if trend_score < min_score:\n            return False\n\n        # Quality score: slightly relaxed — quality engine\n        # already hard-caps overbought/oversold at score 20\n        # so fake signals are caught there, not here\n        if quality_score < min_score:\n            return False\n\n        return True\n'''
          new = '''        min_score = CONFIG["min_score"]\n\n        if CONFIG.get("require_trend_gate", True) and trend_score < min_score:\n            return False\n\n        if CONFIG.get("require_quality_engine", True) and quality_score < min_score:\n            return False\n\n        return True\n'''
          if old not in text:
              raise SystemExit('validator gate block: exact source block not found')
          validator.write_text(text.replace(old, new, 1))
          PY

      - name: Add Phase 2C focused tests
        run: |
          cat > tests/test_phase2c_decision_pipeline.py <<'PY'
          from config import CONFIG
          from engines.validator import SignalValidator

          def test_disabled_legacy_gates_do_not_fabricate_score():
              original_trend = CONFIG.get("require_trend_gate")
              original_quality = CONFIG.get("require_quality_engine")
              CONFIG["require_trend_gate"] = False
              CONFIG["require_quality_engine"] = False
              try:
                  assert SignalValidator().validate("LONG", 10, 10, {"rr": 2.0}) is True
              finally:
                  CONFIG["require_trend_gate"] = original_trend
                  CONFIG["require_quality_engine"] = original_quality

          def test_enabled_trend_gate_still_rejects_low_score():
              original_trend = CONFIG.get("require_trend_gate")
              original_quality = CONFIG.get("require_quality_engine")
              CONFIG["require_trend_gate"] = True
              CONFIG["require_quality_engine"] = False
              try:
                  assert SignalValidator().validate("LONG", 69, 10, {"rr": 2.0}) is False
              finally:
                  CONFIG["require_trend_gate"] = original_trend
                  CONFIG["require_quality_engine"] = original_quality

          def test_enabled_quality_gate_still_rejects_low_score():
              original_trend = CONFIG.get("require_trend_gate")
              original_quality = CONFIG.get("require_quality_engine")
              CONFIG["require_trend_gate"] = False
              CONFIG["require_quality_engine"] = True
              try:
                  assert SignalValidator().validate("LONG", 10, 69, {"rr": 2.0}) is False
              finally:
                  CONFIG["require_trend_gate"] = original_trend
                  CONFIG["require_quality_engine"] = original_quality
          PY

      - name: Verify Phase 2C
        run: |
          python -m py_compile scanner_v5.py engines/validator.py tests/test_phase2c_decision_pipeline.py
          python -m pytest -q tests/test_live_entry_integrity.py tests/test_rrce_strategy_integrity.py tests/test_phase2b_engines.py tests/test_phase2c_decision_pipeline.py

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scanner_v5.py engines/validator.py tests/test_phase2c_decision_pipeline.py
          git rm .github/workflows/apply_phase2c_fix.yml
          git commit -m "[phase2c] fix decision pipeline gate integrity"
          git push
