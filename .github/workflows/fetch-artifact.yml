name: Fetch replay artifact (research, read-only)

# One-shot helper: copies an EXISTING artifact of a finished run onto this branch so
# it can be inspected. It does not run the scanner or any backtest.
on:
  push:
    branches: [research/fetch-run81-artifact]
    paths: [".github/workflows/fetch-artifact.yml"]

permissions:
  actions: read
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download existing artifact from Historical Backtest #81
        uses: actions/download-artifact@v4
        with:
          name: historical-backtest-result
          run-id: 38146662222
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: fetched
      - name: Record checksums and commit to this branch
        run: |
          ls -l fetched
          sha256sum fetched/* | tee fetched/SHA256.txt
          git config user.name "claude-audit"
          git config user.email "claude-audit@users.noreply.github.com"
          git add fetched
          git commit -m "Add Run #81 artifact copy for forensic review [skip ci]"
          git push origin HEAD:research/fetch-run81-artifact
