name: LONG research replay (isolated, research only)

# Research-only. Runs the SAME replay harness with BACKTEST_ALLOW_LONG=1 so LONG
# candidates are produced with full indicator / RRCE telemetry. Production workflows,
# LONG_SIGNALS_ENABLED=false in scanner.yml, and the SHORT replay contract are untouched.
# Trigger: push that changes long_research/request.json (this branch only).
on:
  push:
    branches: [research/long-replay]
    paths: [long_research/request.json]

concurrency:
  group: long-research-replay
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  replay:
    name: LONG 10-day chunk (offset ${{ matrix.offset_days }}d)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        offset_days: [120, 110, 100, 90, 80, 70, 60, 50, 40, 30, 20, 10]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Replay integrity and LONG switch tests
        run: python -m pytest -q tests/test_historical_replay_data_integrity.py tests/test_replay_long_research_switch.py
      - name: Run fixed 10-day LONG-enabled replay chunk
        env:
          BACKTEST_DAYS: "10"
          BACKTEST_OFFSET_DAYS: ${{ matrix.offset_days }}
          BACKTEST_ANCHOR_UTC: ${{ github.run_started_at }}
          BACKTEST_ALLOW_LONG: "1"
          BOT_TOKEN: ""
          CHAT_ID: ""
        run: python tools/historical_replay.py
      - name: Validate chunk metadata and coverage
        env:
          EXPECTED_OFFSET: ${{ matrix.offset_days }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path("backtest_results.json").read_text(encoding="utf-8"))
          meta=data.get("metadata",{})
          assert int(meta.get("days",-1))==10, meta.get("days")
          assert int(meta.get("offset_days",-1))==int(os.environ["EXPECTED_OFFSET"]), meta.get("offset_days")
          assert meta.get("timeline_coverage",{}).get("missing_scans")==0, meta.get("timeline_coverage")
          assert meta.get("long_signals_enabled") is True
          assert meta.get("replay_direction_policy")==["LONG","SHORT"]
          rows=data["results"]
          longs=[r for r in rows if r.get("direction")=="LONG"]
          shorts=[r for r in rows if r.get("direction")=="SHORT"]
          print(json.dumps({"offset":meta.get("offset_days"),"start":meta.get("start"),"end":meta.get("end"),"long":len(longs),"short":len(shorts)},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: long-research-chunk-${{ matrix.offset_days }}
          path: backtest_results.json
          if-no-files-found: error
          retention-days: 21
