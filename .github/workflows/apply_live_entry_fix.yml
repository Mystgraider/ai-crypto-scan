name: Apply Live Entry Integrity Fix

on:
  push:
    paths:
      - '.github/workflows/apply_live_entry_fix.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch scanner
        shell: python
        run: |
          from pathlib import Path

          p = Path('scanner_v5.py')
          s = p.read_text()

          imp = 'from engines.position_sizer      import PositionSizer\n'
          add = imp + 'from engines.live_entry_integrity import revalidate as revalidate_live_entry\n'
          assert imp in s
          assert 'from engines.live_entry_integrity import revalidate as revalidate_live_entry' not in s
          s = s.replace(imp, add, 1)

          old = 'rrce_risk = rrce_engine.live_entry_levels('
          assert s.count(old) == 1
          s = s.replace(old, 'rrce_risk = active_rrce_engine.live_entry_levels(', 1)

          anchor = '                    "tp3":             risk["tp3"],\n                    "rsi":             round(rsi, 2),\n'
          replacement = '                    "tp3":             risk["tp3"],\n                    "_rrce_stage4":   rrce_result["stage4"],\n                    "_rrce_engine_mode": "range" if is_range_regime else "default",\n                    "rsi":             round(rsi, 2),\n'
          assert s.count(anchor) == 1
          s = s.replace(anchor, replacement, 1)

          start = '''        try:\n            fresh_price = float(exchange.fetch_ticker(sig["symbol"])["last"])\n            drift_pct = abs(fresh_price - sig["entry"]) / sig["entry"] * 100\n            max_drift = CONFIG.get("max_entry_drift_pct", 0.6)\n            if drift_pct > max_drift:\n                print(f"  ⏭️  {sig['symbol']} {sig['direction']} skipped — "\n                      f"price drifted {drift_pct:.2f}% since detection "\n                      f"(entry {sig['entry']} → now {fresh_price})")\n                continue\n            sig["entry"] = fresh_price\n        except Exception as e:\n            print(f"  ⚠️  {sig['symbol']} staleness check failed ({e}) — sending with original entry")\n'''
          end = '''        try:\n            fresh_price = float(exchange.fetch_ticker(sig["symbol"])["last"])\n            drift_pct = abs(fresh_price - sig["entry"]) / sig["entry"] * 100\n            max_drift = CONFIG.get("max_entry_drift_pct", 0.6)\n            if drift_pct > max_drift:\n                print(f"  ⏭️  {sig['symbol']} {sig['direction']} skipped — "\n                      f"price drifted {drift_pct:.2f}% since detection "\n                      f"(entry {sig['entry']} → now {fresh_price})")\n                continue\n\n            live_rrce_engine = range_rrce_engine if sig.get("_rrce_engine_mode") == "range" else rrce_engine\n            live_risk = revalidate_live_entry(\n                rrce_engine=live_rrce_engine,\n                direction=sig["direction"],\n                live_price=fresh_price,\n                stage4=sig.get("_rrce_stage4"),\n                max_deviation_pct=max_drift,\n                min_rr=CONFIG["min_rr"],\n            )\n            if not live_risk.get("valid"):\n                print(f"  ⏭️  {sig['symbol']} {sig['direction']} skipped — live RRCE revalidation failed: {live_risk.get('reason', 'unknown')}")\n                continue\n\n            sig["entry"] = live_risk["entry"]\n            sig["sl"] = live_risk["sl"]\n            sig["tp1"] = live_risk["tp1"]\n            sig["tp2"] = live_risk["tp2"]\n            sig["tp3"] = live_risk["tp3"]\n            sig["rr"] = live_risk["rr"]\n        except Exception as e:\n            print(f"  ⚠️  {sig['symbol']} live entry validation failed ({e}) — skipping signal")\n            continue\n'''
          assert s.count(start) == 1
          s = s.replace(start, end, 1)

          save_anchor = '        save_signal(\n            symbol=sig["symbol"],'
          assert s.count(save_anchor) == 1
          s = s.replace(save_anchor, '        sig.pop("_rrce_stage4", None)\n        sig.pop("_rrce_engine_mode", None)\n\n' + save_anchor, 1)

          p.write_text(s)
          print('PATCH_OK')
      - name: Verify
        run: |
          python -m py_compile scanner_v5.py engines/live_entry_integrity.py tests/test_live_entry_integrity.py
          python -m pytest -q tests/test_live_entry_integrity.py
      - name: Commit and cleanup
        run: |
          git config user.name "Elite Scanner Bot"
          git config user.email "bot@elitescanner.dev"
          rm .github/workflows/apply_live_entry_fix.yml .github/workflows/patch_live_entry_integrity.yml
          git add scanner_v5.py .github/workflows/apply_live_entry_fix.yml .github/workflows/patch_live_entry_integrity.yml
          git commit -m "fix: revalidate live RRCE entry levels before alert"
          git push
